spring.application.name=ai-service
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

app.rabbitmq.document-exchange=document.exchange
app.rabbitmq.document-uploaded-queue=document.uploaded.queue
app.rabbitmq.document-uploaded-routing-key=document.uploaded
app.rabbitmq.notification-queue=notification.queue
app.rabbitmq.notification-routing-key=notification.created

app.rag.chunk-size=1200
app.rag.chunk-overlap=200
app.rag.top-k=5
app.rag.cache-ttl-seconds=1800

app.openai.api-key=${OPENAI_API_KEY:}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
app.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4.1-mini}

app.qdrant.url=${QDRANT_URL:http://localhost:6333}
app.qdrant.collection=career_documents
app.qdrant.vector-size=1536
