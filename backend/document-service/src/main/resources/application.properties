spring.application.name=document-service

server.port=8082

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/document_db
spring.datasource.username=root
spring.datasource.password=Pavan123#

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# File Storage
app.storage.location=uploads

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbitmq.document-exchange=document.exchange
app.rabbitmq.document-uploaded-queue=document.uploaded.queue
app.rabbitmq.document-uploaded-routing-key=document.uploaded
app.rabbitmq.notification-queue=notification.queue
app.rabbitmq.notification-routing-key=notification.created

logging.level.org.springframework.security=INFO
